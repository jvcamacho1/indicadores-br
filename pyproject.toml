[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indicadores"
version = "0.1.0"
description = "ELT de indicadores econômicos do Brasil (BCB e IBGE) com Airflow e dbt"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "psycopg2-binary>=2.9"]

[tool.setuptools]
packages = ["indicadores"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["dbt/target", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
