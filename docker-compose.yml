# Tudo local: Postgres (metadados do Airflow + warehouse) e Airflow standalone.
#   make up   -> http://localhost:8080 (login automático, só para uso local)
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-warehouse.sql:/docker-entrypoint-initdb.d/10-warehouse.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  airflow:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    command: standalone
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/projeto/dags
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      PYTHONPATH: /opt/projeto
      PROJETO_DIR: /opt/projeto
      DBT_BIN: /home/airflow/dbt-venv/bin/dbt
      DBT_PROFILES_DIR: /opt/projeto/dbt
      WAREHOUSE_HOST: postgres
      WAREHOUSE_PORT: "5432"
      WAREHOUSE_USER: warehouse
      WAREHOUSE_PASSWORD: warehouse
      WAREHOUSE_DB: warehouse
    volumes:
      - ./:/opt/projeto
    ports:
      - "8080:8080"

volumes:
  pgdata:
